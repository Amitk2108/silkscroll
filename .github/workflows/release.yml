name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test

      - name: Build release
        run: cargo build --release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/silkscroll.exe dist/silkscroll.exe
          $hash = (Get-FileHash dist/silkscroll.exe -Algorithm SHA256).Hash.ToLower()
          # LF line ending and no BOM, so `sha256sum -c` works everywhere.
          [IO.File]::WriteAllText("$PWD/dist/silkscroll.exe.sha256", "$hash  silkscroll.exe`n")

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          name: SilkScroll ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/silkscroll.exe
            dist/silkscroll.exe.sha256
