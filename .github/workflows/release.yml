name: Release

# Every change to the app that lands on main ships as a new release with a
# fresh silkscroll.exe. The version comes from Cargo.toml:
#   - if Cargo.toml's version has no release yet, that version is released
#     (bump it there for a new minor or major version);
#   - otherwise the next patch number is used: 0.2.0 -> 0.2.1 -> 0.2.2 ...
# Documentation-only changes don't produce a release. Run the workflow by hand
# (Actions -> Release -> Run workflow) to force one.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "res/**"
      - "build.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "installer/**"
  workflow_dispatch:

permissions:
  contents: write

# Releases are numbered in order, so never run two at once.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags and history, for the version and the release notes

      - name: Pick the version
        id: version
        shell: bash
        run: |
          base=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if git tag --points-at HEAD | grep -q '^v'; then
            echo "This commit is already released."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git rev-parse -q --verify "refs/tags/v$base" > /dev/null; then
            version="$base"
          else
            minor="${base%.*}"
            last=$(git tag -l "v$minor.*" | sed 's/^v//' | sort -V | tail -1)
            version="$minor.$(( ${last##*.} + 1 ))"
          fi
          echo "Releasing $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Stamp the version into the build
        if: steps.version.outputs.skip == 'false'
        shell: bash
        run: |
          v="${{ steps.version.outputs.version }}"
          sed -i "0,/^version = \".*\"/s//version = \"$v\"/" Cargo.toml
          sed -i "s/name=\"SilkScroll\" version=\"[0-9.]*\"/name=\"SilkScroll\" version=\"$v.0\"/" res/silkscroll.manifest
          grep -m1 '^version' Cargo.toml

      - name: Install Rust
        if: steps.version.outputs.skip == 'false'
        uses: dtolnay/rust-toolchain@stable

      - name: Test
        if: steps.version.outputs.skip == 'false'
        run: cargo test

      - name: Build release
        if: steps.version.outputs.skip == 'false'
        run: cargo build --release

      - name: Install Inno Setup
        if: steps.version.outputs.skip == 'false'
        shell: pwsh
        run: if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build installer
        if: steps.version.outputs.skip == 'false'
        shell: pwsh
        run: ./installer/build.ps1 -Version ${{ steps.version.outputs.version }} -OutDir dist

      - name: Test installer (install, upgrade over a running copy, uninstall)
        if: steps.version.outputs.skip == 'false'
        shell: pwsh
        run: ./installer/smoke-test.ps1 -Setup dist/SilkScroll-Setup.exe -Version ${{ steps.version.outputs.version }}

      - name: Package and write release notes
        if: steps.version.outputs.skip == 'false'
        shell: bash
        run: |
          cp target/release/silkscroll.exe dist/silkscroll.exe
          (cd dist && sha256sum SilkScroll-Setup.exe silkscroll.exe | sed 's/ \*/  /' > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

          previous=$(git describe --tags --abbrev=0 --match 'v*' HEAD 2>/dev/null || true)
          {
            echo "## Download"
            echo
            echo "- **SilkScroll-Setup.exe**: installer (recommended). Installs or updates SilkScroll, adds it to the"
            echo "  Start menu and to *Settings > Apps* for uninstalling. Running it over an older version upgrades it"
            echo "  in place and keeps your settings."
            echo "- **silkscroll.exe**: portable version, no installation. Starting it replaces any older copy that is"
            echo "  running."
            echo
            echo "## Changes"
            git log --no-merges --pretty='- %s (%h)' ${previous:+$previous..HEAD}
            echo
            echo "Checksums are in \`SHA256SUMS.txt\`."
          } > dist/notes.md
          cat dist/notes.md

      - name: Publish release
        if: steps.version.outputs.skip == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: SilkScroll v${{ steps.version.outputs.version }}
          body_path: dist/notes.md
          make_latest: true
          files: |
            dist/SilkScroll-Setup.exe
            dist/silkscroll.exe
            dist/SHA256SUMS.txt
