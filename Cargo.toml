[package]
name = "silkscroll"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Smooth scrolling for every Windows app"
license = "MIT"
repository = "https://github.com/Amitk2108/silkscroll"
homepage = "https://github.com/Amitk2108/silkscroll"
readme = "README.md"
keywords = ["smooth-scrolling", "mouse", "windows", "scroll", "tray"]
categories = ["accessibility", "os::windows-apis"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_System_Registry", "Win32_Security", "Win32_UI_HiDpi", "Win32_Media", "Win32_System_RemoteDesktop", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_Storage_FileSystem"] }

[build-dependencies]
embed-resource = "3.0.12"

[profile.release]
lto = true
codegen-units = 1
strip = true
